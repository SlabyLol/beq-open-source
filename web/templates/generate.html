{% extends "base.html" %}

{% block title %}Generate with Beq{% endblock %}

{% block content %}
<section class="hero">
    <h1>Generate</h1>
    <p class="subtitle">Use the API-style generation endpoint from the browser.</p>
</section>

{% if not model_loaded %}
<div class="alert alert-warning">
    Model not loaded. Train Beq first with <code>python train/train.py</code>
</div>
{% else %}
<section class="chat-box">
    <div class="chat-form">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" rows="4" placeholder="Once upon a time..."></textarea>

        <div class="controls">
            <div class="control-group">
                <label for="max_tokens">Max tokens</label>
                <input type="number" id="max_tokens" value="120" min="10" max="200">
            </div>
            <div class="control-group">
                <label for="temperature">Temperature</label>
                <input type="number" id="temperature" value="0.8" min="0.1" max="1.5" step="0.1">
            </div>
            <button type="button" class="btn-primary" onclick="generate()">Generate</button>
        </div>
    </div>

    <div id="result" class="result" style="display:none;">
        <h3>Output</h3>
        <div id="output" class="output"></div>
    </div>
</section>

<script>
async function generate() {
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) {
        alert('Please enter a prompt');
        return;
    }

    const max_tokens = parseInt(document.getElementById('max_tokens').value) || 120;
    const temperature = parseFloat(document.getElementById('temperature').value) || 0.8;

    const resultDiv = document.getElementById('result');
    const outputDiv = document.getElementById('output');
    outputDiv.textContent = 'Generating...';
    resultDiv.style.display = 'block';

    try {
        const res = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt, max_tokens, temperature, top_k: 40 })
        });
        const data = await res.json();

        if (data.error) {
            outputDiv.textContent = 'Error: ' + data.error;
        } else {
            outputDiv.innerHTML = `<span class="prompt-part">${escapeHtml(data.prompt)}</span><span class="completion-part">${escapeHtml(data.new_text)}</span>`;
        }
    } catch (e) {
        outputDiv.textContent = 'Request failed: ' + e.message;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endif %}
{% endblock %}
