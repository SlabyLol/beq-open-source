name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty to use pyproject.toml)"
        required: false

permissions:
  contents: read
  id-token: write   # Required for trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/beq-open-source

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine hatchling

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      # Preferred: Trusted Publishing (OIDC) – no token needed if configured on PyPI
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

      # Fallback: classic token (uncomment + add secret PYPI_TOKEN if needed)
      # - name: Publish to PyPI (Token)
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_TOKEN }}
