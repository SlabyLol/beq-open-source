name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # Ermöglicht das manuelle Starten über GitHub

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    # WICHTIG: Diese Berechtigungen sind zwingend erforderlich für Trusted Publishing!
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
