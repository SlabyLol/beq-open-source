[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beq-client"
version = "0.1.0"
description = "Python client / plugin for the Beq open-source AI API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Beq" }]
keywords = ["beq", "ai", "llm", "api", "client"]
dependencies = [
  "requests>=2.28.0",
]

[project.optional-dependencies]
async = ["httpx>=0.27.0"]

[project.scripts]
beq = "beq_client.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["beq_client*"]
